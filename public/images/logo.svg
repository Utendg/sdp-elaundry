<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="topArc" d="M 95 250 A 155 155 0 0 1 405 250" fill="none"/>
    <path id="bottomArc" d="M 110 300 A 155 155 0 0 0 390 300" fill="none"/>
  </defs>

  <!-- outer rings -->
  <circle cx="250" cy="250" r="235" fill="#FFFFFF"/>
  <circle cx="250" cy="250" r="235" fill="none" stroke="#0FA153" stroke-width="5"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1A1B4B" stroke-width="2.5"/>

  <!-- small plus accents at diagonals -->
  <g stroke="#1A1B4B" stroke-width="4" stroke-linecap="round">
    <line x1="94" y1="94" x2="106" y2="106"/>
    <line x1="106" y1="94" x2="94" y2="106"/>
    <line x1="394" y1="94" x2="406" y2="106"/>
    <line x1="406" y1="94" x2="394" y2="106"/>
    <line x1="94" y1="394" x2="106" y2="406"/>
    <line x1="106" y1="394" x2="94" y2="406"/>
    <line x1="394" y1="394" x2="406" y2="406"/>
    <line x1="406" y1="394" x2="394" y2="406"/>
  </g>

  <!-- curved text top -->
  <text font-family="'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#1A1B4B" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">AUN E-LAUNDRY</textPath>
  </text>

  <!-- curved text bottom -->
  <text font-family="'DejaVu Sans', sans-serif" font-size="21" font-weight="700" fill="#1A1B4B" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PICK UP &amp; DELIVERY</textPath>
  </text>

  <!-- ===== Laundry basket icon ===== -->
  <g transform="translate(250,270)">

    <!-- sparkles -->
    <g fill="#0FA153">
      <path d="M -95 -70 L -90 -84 L -85 -70 L -71 -65 L -85 -60 L -90 -46 L -95 -60 L -109 -65 Z"/>
    </g>
    <g fill="#C8262A">
      <path d="M 92 -78 L 96 -88 L 100 -78 L 110 -74 L 100 -70 L 96 -60 L 92 -70 L 82 -74 Z"/>
    </g>
    <g fill="#1A1B4B">
      <circle cx="-100" cy="-20" r="5"/>
      <circle cx="105" cy="-15" r="4"/>
    </g>

    <!-- folded clothes stack (behind basket rim) -->
    <rect x="-58" y="-78" width="116" height="30" rx="10" fill="#0FA153"/>
    <rect x="-48" y="-96" width="96" height="30" rx="10" fill="#C8262A"/>
    <rect x="-36" y="-112" width="72" height="26" rx="9" fill="#1A1B4B"/>

    <!-- basket body -->
    <path d="M -95 -55
             L 95 -55
             L 78 65
             C 78 82, 45 92, 0 92
             C -45 92, -78 82, -78 65
             Z"
          fill="#FFFFFF" stroke="#1A1B4B" stroke-width="8" stroke-linejoin="round"/>

    <!-- basket weave lines -->
    <g stroke="#1A1B4B" stroke-width="4" opacity="0.55">
      <line x1="-88" y1="-30" x2="83" y2="-30"/>
      <line x1="-83" y1="0" x2="79" y2="0"/>
      <line x1="-79" y1="30" x2="75" y2="30"/>
      <line x1="-70" y1="58" x2="68" y2="58"/>
    </g>

    <!-- basket rim -->
    <rect x="-100" y="-66" width="200" height="20" rx="10" fill="#1A1B4B"/>

    <!-- handles -->
    <path d="M -100 -56 C -118 -56, -118 -30, -104 -22" fill="none" stroke="#1A1B4B" stroke-width="8" stroke-linecap="round"/>
    <path d="M 100 -56 C 118 -56, 118 -30, 104 -22" fill="none" stroke="#1A1B4B" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
