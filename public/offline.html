<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#222454">
    <title>Offline · AUN E-Laundry</title>
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #1f2937; }
        main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
        img { width: 96px; height: 96px; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; color: #222454; margin: 0 0 8px; }
        p { max-width: 340px; line-height: 1.5; margin: 0 0 20px; color: #4b5563; }
        button { background: #222454; color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/images/logo.svg" alt="AUN E-Laundry">
    <h1>You're offline</h1>
    <p>AUN E-Laundry needs an internet connection to show your orders and prices. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
